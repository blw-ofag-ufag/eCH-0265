name: CI/CD pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest
    
    # force terminal tools to output colors in GitHub Actions
    env:
      FORCE_COLOR: "1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up dependencies
        run: make setup

      # 1. FOR PULL REQUESTS: Only run the tests
      - name: Run pipeline and test
        if: github.ref != 'refs/heads/main'
        run: make test

      # 2. FOR MAIN BRANCH: Run tests and publish
      # If this step fails, the subsequent documentation steps are automatically skipped.
      - name: Run pipeline, test, and publish
        if: github.ref == 'refs/heads/main'
        env:
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRAPH: ${{ secrets.GRAPH }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
        run: make publish

      # 3. FOR MAIN BRANCH: Build documentation
      - name: Build documentation site
        if: github.ref == 'refs/heads/main'
        run: make docs

      # 4. FOR MAIN BRANCH: Deploy documentation
      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/
          publish_branch: gh-pages