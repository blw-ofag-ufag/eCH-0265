name: CI/CD pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest
    
    # force terminal tools to output colors in GitHub Actions
    env:
      FORCE_COLOR: "1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system fonts for Typst
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-urw-base35

      - name: Set up dependencies
        run: make setup

      - name: Build processed RDF graph
        run: make build

      - name: Run tests
        run: make test

      - name: Publish RDF graph to LINDAS
        if: github.ref == 'refs/heads/main'
        env:
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRAPH: ${{ secrets.GRAPH }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
        run: make publish

      - name: Build documentation page
        if: github.ref == 'refs/heads/main'
        run: make docs

      - name: Deploy documentation page
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/
          publish_branch: gh-pages
