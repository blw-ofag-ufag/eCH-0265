  status-description:
    in-progress: Der Gebrauch ist nur innerhalb der Fachgruppe, beziehungsweise im Expertenausschuss zugelassen.
    draft: Das Dokument wurde von den zuständigen Referentinnen und Referenten aus dem Expertenausschuss zur öffentlichen Konsultation freigegeben und entsprechend publiziert.
    proposal: Das Dokument wird dem Expertenausschuss zur Genehmigung vorgelegt, ist aber normativ noch nicht gültig.
    approved: Das Dokument wurde vom Expertenausschuss genehmigt und hat für das definierte Einsatzgebiet im festgelegten Gültigkeitsbereich normative Kraft.
    replaced: Das Dokument wurde durch eine neue, aktuellere Version ersetzt. Die Benutzung ist zwar noch möglich, es wird aber empfohlen, die neuere Version einzusetzen.
    repealed: Das Dokument wurde von eCH zurückgezogen. Es darf nicht mehr genutzt werden.
    suspended: Das Dokument wurde von eCH zurückgezogen. Es darf nicht genutzt werden. Im Unterschied zum Status «Aufgehoben» hat das Dokument die ordentlichen Prozessschritte nicht durchlaufen oder hat den Status «Genehmigt» nicht erreicht.
