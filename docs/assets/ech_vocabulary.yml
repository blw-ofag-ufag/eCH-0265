# Translations of the eCH title page: field labels, enumeration values and
# fixed texts, per language. Values are parsed as Markdown.
#
# The codes used in docs/_ech.yml are the keys of `category`, `maturity`,
# `status`, `change` and `language`. Labels follow the eCH Word templates
# (eCH-0003 V11.1.0) and the published French and English eCH standards.

