  status-description:
    in-progress: L'utilisation est autorisée uniquement au sein du groupe spécialisé et/ou du Comité des experts.
    draft: Le document a été validé par les référents et référentes compétents du Comité des experts en vue de sa consultation publique, et a été publié en conséquence.
    proposal: Le document doit être présenté au Comité des experts en vue de son approbation, mais n'est pas encore valable d'un point de vue normatif.
    approved: Le document a été approuvé par le Comité des experts et a force normative pour le domaine d'application défini dans la sphère de validité stipulée.
    replaced: Le document a été remplacé par une version plus récente. Il peut encore être utilisé, mais il est recommandé d'appliquer la version la plus récente.
    repealed: Le document a été retiré par l'association eCH. Il ne doit plus être utilisé.
    suspended: Le document a été retiré par l'association eCH. Il ne doit pas être utilisé. À la différence du statut «Supprimé», le document n'est pas passé par toutes les étapes normales du processus ou n'a pas atteint le statut «Approuvé».
