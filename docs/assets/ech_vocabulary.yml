  status-description:
    in-progress: Use is only permitted within the Technical Unit or the Expert Committee.
    draft: The document has been released for public consultation by the responsible rapporteurs of the Expert Committee and published accordingly.
    proposal: The document is submitted to the Expert Committee for approval, but is not yet normatively valid.
    approved: The document has been approved by the Expert Committee and has normative force for the defined field of application within the specified scope of validity.
    replaced: The document has been replaced by a newer version. It may still be used, but it is recommended to use the newer version.
    repealed: The document has been withdrawn by eCH. It may no longer be used.
    suspended: The document has been withdrawn by eCH. It may not be used. Unlike the status «Repealed», the document has not passed through the regular process steps or has not reached the status «Approved».
