project:
  output-dir: ../build/docs/
  type: website
  render:
    - de/index.qmd

website:
  title: eCH-0265 Version 2.0.0 (Working Draft)
  repo-url: https://github.com/blw-ofag-ufag/eCH-0265
  favicon: assets/favicon.svg
  navbar:
    background: dark
    title: false
    logo: assets/ech.svg
    logo-alt: eCH
    right:
      - icon: github
        href: https://github.com/blw-ofag-ufag/eCH-0265
        aria-label: GitHub
      - icon: bug
        href: https://github.com/blw-ofag-ufag/eCH-0265/issues/new
        aria-label: Issue
      - icon: envelope
        href: mailto:agridata.ch@blw.admin.ch
        aria-label: Contact
  announcement:
    icon: info-circle
    dismissable: true
    content: Diese Seite beinhaltet einen *Working Draft* und kann sich dadurch laufend verändern. Für eine aktuelle Version, besuchen Sie [ech.ch](https://ech.ch/de/ech/ech-0265/).
    type: warning

bibliography: references.yaml
csl: assets/din_1505_2_alphanumeric.csl

# eCH metadata shared by all languages, translated by the Lua filter
metadata-files:
  - _ech.yml
filters:
  - assets/ech_metadata.lua
  - quarto
  - assets/ech_captions.lua
shortcodes:
  - assets/ech_shortcodes.lua

format:
  html:
    theme:
      light: [cosmo, assets/ech.scss]
      dark: [cosmo, assets/ech.scss, assets/ech_dark.scss]
    template-partials:
      - assets/title-metadata.html
    toc: true
    toc-depth: 2
    highlight-style: github   # muted colours in both the light and the dark theme
    code-line-numbers: true
    tbl-colwidths: true       # keep the column widths of the generated grid tables
    reference-location: margin   # footnotes in the right margin, beside the text
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-earmark-pdf
      - format: gfm
        text: Markdown
        icon: markdown
    number-sections: true
    lightbox: true
    syntax-definitions:
     - assets/sparql.xml
     - assets/turtle.xml
  gfm: 
    toc: true
    toc-depth: 2
    number-sections: true
  docx:
    toc: true
    toc-depth: 2
    number-sections: true
    reference-doc: https://ech.ch/sites/default/files/imce/eCH-Dossier/0001-0030/eCH-0003/11.1.0/Beilagen/Beilagen%20aktuell%2028.11.2025/XXXX_d_DRA_JJJJ-MM-TT_eCH-0XXX_Vx.x.x_Titel.docx
    link-citations: true
  typst:
    papersize: a4
    mainfont: Nimbus Sans
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: true
    section-numbering: 1.1.1
    template-partials:
      - assets/typst-template.typ
      - assets/typst-show.typ
    code-line-numbers: true
    syntax-definitions:
     - assets/sparql.xml
     - assets/turtle.xml
    citeproc: true
    link-citations: true

# Code chunks show only their output; use `#| echo: true` to show the code.
execute:
  echo: false
  warning: false
  message: false
